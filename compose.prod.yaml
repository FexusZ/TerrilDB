# Production (voir docs/deploy.md). Lancé par docker/prod/deploy.sh, qui fournit TERRILDB_DEPLOY_DIR (secrets hors dépôt),
# TERRILDB_DOMAIN et l'étiquette de l'image.
name: terrildb-prod

services:
  app:
    image: terrildb:${TERRILDB_TAG:-latest}
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    restart: unless-stopped
    # Système de fichiers en lecture seule : l'application n'écrit que dans les tmpfs et le volume des sessions ci-dessous.
    read_only: true
    tmpfs:
      - /app/var/cache:uid=33,gid=33,mode=0700,size=128m
      - /app/var/log:uid=33,gid=33,mode=0700,size=16m
      - /tmp:uid=33,gid=33,mode=1777,size=64m
    env_file: ${TERRILDB_DEPLOY_DIR:?}/app.env
    environment:
      APP_ENV: prod
      TERRILDB_ALLOWED_HOSTS: ${TERRILDB_DOMAIN:?}
      TERRILDB_PUBLIC_URL: https://${TERRILDB_DOMAIN:?}
      # Le reverse proxy de l'hôte arrive depuis le réseau Docker : sans lui, toutes les adresses clientes seraient
      # la sienne (et les plafonds de tentatives, partagés).
      SYMFONY_TRUSTED_PROXIES: private_ranges
      # Le délai (secondes) du reverse proxy de l'hôte, qui règle aussi nginx (docker/prod/proxy-timeout.sh) : l'application en tire
      # la limite de durée d'une requête ou d'un script.
      TERRILDB_PROXY_TIMEOUT: ${TERRILDB_PROXY_TIMEOUT:-120}
      # Bastions SSH autorisés (« hôte » ou « hôte:port », virgules) : VIDE par défaut = tout refusé, le tunnel reste éteint.
      # Le conteneur `tunnel` lit la même valeur (docs/ssh-tunnel.md).
      TERRILDB_SSH_ALLOWED_BASTIONS: ${TERRILDB_SSH_ALLOWED_BASTIONS:-}
    ports:
      # Local par défaut ; TERRILDB_BIND ouvre temporairement une adresse du réseau privé (création du premier compte).
      - "${TERRILDB_BIND:-127.0.0.1}:${TERRILDB_PORT:-8090}:8080"
    depends_on:
      db:
        condition: service_healthy
    # « default » pour joindre les bases des utilisateurs, « backend » (sans sortie) pour la base interne.
    networks: [default, backend]
    volumes:
      - sessions:/data/sessions
      # Sockets du tunnel SSH (dossier 0700 posé par `tunnel-init`) : seul lien avec le conteneur `tunnel`.
      - tunnel-sockets:/run/tunnels
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8080/api/health') ? 0 : 1);"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: ${TERRILDB_DEPLOY_DIR:?}/db.env
    # Seul réseau de la base interne : interne à Docker (aucune sortie), partagé avec l'application et rien d'autre.
    networks: [backend]
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrildb"]
      interval: 3s
      retries: 20

  # Tunnel SSH (#13), facultatif : `deploy.sh` ne le démarre que si TERRILDB_SSH_ALLOWED_BASTIONS (deploy.env) n'est pas vide. Seul
  # conteneur à embarquer `ssh` et à sortir vers les bastions ; l'application lui parle par un socket Unix (volume), pas par le réseau.
  # Même uid que l'application (www-data, 33) : le dossier des sockets est en 0700. Règles de sortie : docs/deploy.md.
  tunnel-init:
    profiles: [tunnel]
    image: alpine:3
    user: root
    restart: "no"
    command: ["sh", "-c", "chown 33:33 /run/tunnels && chmod 700 /run/tunnels"]
    volumes:
      - tunnel-sockets:/run/tunnels
    networks: [tunnel]

  tunnel:
    profiles: [tunnel]
    image: terrildb-tunnel:${TERRILDB_TAG:-latest}
    build:
      context: docker/tunnel
      args:
        UID: 33
        GID: 33
    restart: unless-stopped
    user: "33:33"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    # Les clés privées n'existent que dans ce tmpfs, le temps de l'authentification.
    tmpfs:
      - /run/relay-keys:mode=0700,uid=33,gid=33
      - /tmp
    volumes:
      - tunnel-sockets:/run/tunnels
    environment:
      TERRILDB_SSH_ALLOWED_BASTIONS: ${TERRILDB_SSH_ALLOWED_BASTIONS:-}
    networks: [tunnel]
    depends_on:
      tunnel-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/tunnels/control.sock"]
      interval: 3s
      retries: 20

networks:
  backend:
    internal: true
  # Seul réseau avec sortie du tunnel : ce sous-réseau (`terrildb-prod_tunnel`) reçoit les règles de sortie vers les bastions.
  tunnel: {}

volumes:
  db-data:
  sessions:
  tunnel-sockets:
