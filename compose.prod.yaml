# Production (voir docs/deploy.md). Lancé par docker/prod/deploy.sh, qui fournit TERRILDB_DEPLOY_DIR (secrets hors dépôt),
# TERRILDB_DOMAIN et l'étiquette de l'image.
name: terrildb-prod

services:
  app:
    image: terrildb:${TERRILDB_TAG:-latest}
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    restart: unless-stopped
    env_file: ${TERRILDB_DEPLOY_DIR:?}/app.env
    environment:
      APP_ENV: prod
      TERRILDB_ALLOWED_HOSTS: ${TERRILDB_DOMAIN:?}
      TERRILDB_PUBLIC_URL: https://${TERRILDB_DOMAIN:?}
      # Le reverse proxy de l'hôte arrive depuis le réseau Docker : sans lui, toutes les adresses clientes seraient
      # la sienne (et les plafonds de tentatives, partagés).
      SYMFONY_TRUSTED_PROXIES: private_ranges
    ports:
      # Local par défaut ; TERRILDB_BIND ouvre temporairement une adresse du réseau privé (création du premier compte).
      - "${TERRILDB_BIND:-127.0.0.1}:${TERRILDB_PORT:-8090}:8080"
    depends_on:
      db:
        condition: service_healthy
    # « default » pour joindre les bases des utilisateurs, « backend » (sans sortie) pour la base interne.
    networks: [default, backend]
    volumes:
      - sessions:/data/sessions
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8080/api/health') ? 0 : 1);"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: ${TERRILDB_DEPLOY_DIR:?}/db.env
    # Seul réseau de la base interne : interne à Docker (aucune sortie), partagé avec l'application et rien d'autre.
    networks: [backend]
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrildb"]
      interval: 3s
      retries: 20

networks:
  backend:
    internal: true

volumes:
  db-data:
  sessions:
