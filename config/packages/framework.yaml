# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        name: TERRILDB_SESSION
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true

    rate_limiter:
        # Tentatives de connexion : par adresse (beaucoup de comptes) et par compte (mot de passe ou code TOTP deviné)
        login_ip:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        login_account:
            policy: sliding_window
            limit: 8
            interval: '15 minutes'
        # Une seule mention « tentatives bloquées » par minute et par compte dans le journal d'audit
        login_notice:
            policy: fixed_window
            limit: 1
            interval: '1 minute'
        # API : échecs d'authentification par adresse, et budget de requêtes par jeton
        api_failures:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        api_token:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

    #esi: true
    #fragments: true

when@test:
    framework:
        cache:
            pools:
                # Compteurs de limitation sur fichier, comme en production : ils survivent au redémarrage du
                # conteneur entre deux requêtes (WebApiTestCase les vide au début de chaque test).
                cache.rate_limiter:
                    adapter: cache.adapter.filesystem
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
