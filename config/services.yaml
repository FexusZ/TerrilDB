# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # first_only : l'inscription ne reste ouverte que tant qu'il n'existe aucun compte ; open : toujours ouverte
    env(APP_REGISTRATION): first_only
    # Durée de conservation du journal d'audit, en jours (commande app:audit:purge)
    env(TERRILDB_AUDIT_RETENTION_DAYS): '365'
    # Noms d'hôte acceptés par le point d'entrée MCP (protection contre le « DNS rebinding »), séparés par des virgules
    env(TERRILDB_ALLOWED_HOSTS): 'localhost,127.0.0.1,[::1]'

    # Envoi des invitations par e-mail : actif seulement si l'expéditeur ET l'adresse publique sont renseignés
    # (avec MAILER_DSN). Sans cela, l'administrateur transmet le lien lui-même.
    env(TERRILDB_MAIL_FROM): ''
    env(TERRILDB_PUBLIC_URL): ''

    # Grosse table : au-delà de ce nombre de lignes ESTIMÉES (jamais un COUNT), modifier la structure affiche un avertissement ;
    # au-delà du second seuil il faut en plus retaper le nom de la table. 0 désactive le seuil.
    env(TERRILDB_BIG_TABLE_WARN_ROWS): '100000'
    env(TERRILDB_BIG_TABLE_CONFIRM_ROWS): '1000000'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Invitation\InvitationMailer:
        arguments:
            $from: '%env(TERRILDB_MAIL_FROM)%'
            $publicUrl: '%env(TERRILDB_PUBLIC_URL)%'

    App\Core\Schema\Change\BigTablePolicy:
        arguments:
            $warnAt: '%env(int:TERRILDB_BIG_TABLE_WARN_ROWS)%'
            $confirmAt: '%env(int:TERRILDB_BIG_TABLE_CONFIRM_ROWS)%'

    App\Http\Web\RegistrationPolicy:
        arguments:
            $mode: '%env(APP_REGISTRATION)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    parameters:
        # Seuils bas pour que les tests n'aient pas à remplir des centaines de milliers de lignes
        env(TERRILDB_BIG_TABLE_WARN_ROWS): '10'
        env(TERRILDB_BIG_TABLE_CONFIRM_ROWS): '100'
    services:
        # Aucun service n'injecte encore le coffre : sans cela le conteneur compilé retire l'alias.
        App\Crypto\SessionKeyVault:
            alias: App\Http\Web\Session\WrappedSessionKeyVault
            public: true
        # Pas encore injecté par un contrôleur : sans cela le conteneur compilé le retire.
        App\Core\Driver\DriverRegistry:
            autowire: true
            public: true
        # Coûts Argon2id réduits : les tests vérifient le comportement, pas la dureté de la dérivation.
        App\Security\AuthPasswordHasher:
            arguments:
                $opsLimit: 3
                $memLimit: 16384
        App\Crypto\KeyDerivation:
            arguments:
                $opsLimit: 1
                $memLimit: 8192
        # Le stockage de session simulé nomme son cookie MOCKSESSID : le coffre de clés ne reconnaîtrait alors
        # pas la session précédente (hasPreviousSession). On lui donne le vrai nom.
        session.storage.factory.mock_file:
            class: Symfony\Component\HttpFoundation\Session\Storage\MockFileSessionStorageFactory
            arguments:
                - '%kernel.cache_dir%/sessions'
                - TERRILDB_SESSION
