name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP (style, analyse, tests unitaires)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-php-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # L'image PHP met une minute à se construire (compilation des extensions) : elle est gardée d'un run à l'autre, et
      # renouvelée chaque semaine pour reprendre les correctifs de l'image de base.
      - name: Semaine de l'image PHP
        id: semaine
        run: echo "iso=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Image PHP en cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-php.tar
          key: image-php-${{ hashFiles('docker/php/Dockerfile') }}-${{ steps.semaine.outputs.iso }}
      - name: Outils et dépendances
        run: |
          sh docker/init-env.sh
          DC="env UID=$(id -u) GID=$(id -g) docker compose"
          if [ -f "$RUNNER_TEMP/image-php.tar" ]; then
            docker load -i "$RUNNER_TEMP/image-php.tar"
          else
            $DC build php
            docker save -o "$RUNNER_TEMP/image-php.tar" terrildb-php
          fi
          $DC run --rm --no-deps php composer install --no-interaction --no-progress
      - name: Contrôles
        run: |
          DC="env UID=$(id -u) GID=$(id -g) docker compose"
          R="$DC run --rm --no-deps php"
          $R vendor/bin/php-cs-fixer fix --dry-run --diff
          $R vendor/bin/phpstan analyse --no-progress --memory-limit=512M
          $R php bin/console lint:container
          $R vendor/bin/phpunit

  front:
    name: Interface (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-front-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Contrôles
        run: |
          sh docker/init-env.sh
          DC="env UID=$(id -u) GID=$(id -g) docker compose"
          N="$DC run --rm --no-deps node"
          $N npm ci
          $N npm run lint
          $N npm run typecheck
          $N npx vitest run
          $N npm run build

  integration:
    name: Intégration (bases MySQL, MariaDB, PostgreSQL, ClickHouse, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-integration-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # L'image PHP met une minute à se construire (compilation des extensions) : elle est gardée d'un run à l'autre, et
      # renouvelée chaque semaine pour reprendre les correctifs de l'image de base.
      - name: Semaine de l'image PHP
        id: semaine
        run: echo "iso=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Image PHP en cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-php.tar
          key: image-php-${{ hashFiles('docker/php/Dockerfile') }}-${{ steps.semaine.outputs.iso }}
      - name: Bases et dépendances
        run: |
          sh docker/init-env.sh
          DC="env UID=$(id -u) GID=$(id -g) docker compose"
          # Les bases se téléchargent et s'initialisent (une trentaine de secondes) pendant que l'image PHP se construit.
          $DC --profile targets up -d --wait db target-mysql target-mariadb target-postgres target-clickhouse target-redis &
          bases=$!
          if [ -f "$RUNNER_TEMP/image-php.tar" ]; then
            docker load -i "$RUNNER_TEMP/image-php.tar"
          else
            $DC build php
            docker save -o "$RUNNER_TEMP/image-php.tar" terrildb-php
          fi
          $DC run --rm --no-deps php composer install --no-interaction --no-progress
          wait "$bases"
      - name: Schémas de la base interne
        run: |
          DC="env UID=$(id -u) GID=$(id -g) docker compose"
          R="$DC run --rm php"
          $R php bin/console doctrine:database:create --env=test --if-not-exists
          $R php bin/console doctrine:migrations:migrate --env=test --no-interaction
      - name: Tests d'intégration
        run: |
          DC="env UID=$(id -u) GID=$(id -g) docker compose"
          $DC run --rm php vendor/bin/phpunit --group integration
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose --profile targets logs --tail 50

  deploy:
    name: Déploiement
    needs: [php, front, integration]
    # Jamais pour une pull request : ce job tourne sur la machine de production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, terrildb]
    # Un déploiement bloqué occuperait la machine de production (une seule à la fois) : délai maximum.
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Les journaux d'un dépôt public sont lisibles de tous : le compte et les chemins de la machine y sont masqués.
      - name: Masquer le compte et les chemins de la machine
        run: |
          echo "::add-mask::$HOME"
          echo "::add-mask::$(id -un)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Déployer
        env:
          TERRILDB_DOMAIN: ${{ secrets.TERRILDB_DOMAIN }}
        run: sh docker/prod/deploy.sh
