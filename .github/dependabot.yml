version: 2
updates:
  # Mises à jour mineures et correctifs : un seul PR groupé par écosystème et par semaine (le bilan hebdomadaire,
  # .github/workflows/dependency-digest.yml, les rassemble dans une issue). Les versions MAJEURES ne sont pas groupées :
  # chacune a son PR, relu et testé seul, pour qu'une rupture n'empêche pas de prendre les correctifs sûrs.
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Paris }
    labels: [dependencies]
    groups:
      composer: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Paris }
    labels: [dependencies]
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: [/docker/php, /docker/prod]
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Paris }
    labels: [dependencies]
    groups:
      docker: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Paris }
    labels: [dependencies]
    groups:
      docker-compose: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      # La base interne de production : une nouvelle version majeure de PostgreSQL ne lit pas le dossier de données de
      # l'ancienne (dump et restauration à faire à la main, voir docs/deploy.md), jamais par une fusion automatique.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Les cibles de test MySQL et MariaDB gardent DEUX séries chacune (la plus ancienne qu'on supporte et la plus
      # récente, compose.yaml) : une montée de série automatique en ferait glisser une sur l'autre. Les mineures et
      # correctifs de chaque série suivent ; changer de série se fait à la main (TargetVersionTest le garde).
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Paris }
    labels: [dependencies]
    groups:
      github-actions: { patterns: ["*"], update-types: [minor, patch] }
