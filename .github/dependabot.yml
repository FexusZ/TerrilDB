version: 2
updates:
  # Un seul PR groupé par écosystème et par semaine : le bilan hebdomadaire
  # (.github/workflows/dependency-digest.yml) les rassemble dans une issue.
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Paris }
    labels: [dependencies]
    groups:
      composer: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Paris }
    labels: [dependencies]
    groups:
      npm: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/docker/php, /docker/prod]
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Paris }
    labels: [dependencies]
    groups:
      docker: { patterns: ["*"] }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Paris }
    labels: [dependencies]
    groups:
      docker-compose: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Paris }
    labels: [dependencies]
    groups:
      github-actions: { patterns: ["*"] }
