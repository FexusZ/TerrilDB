services:
  php:
    build: docker/php
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - composer-cache:/tmp/composer
    environment:
      COMPOSER_HOME: /tmp/composer
      # Bases cibles de test (tests d'intégration, groupe "integration")
      TARGET_MYSQL_URL: pdo-mysql://root:root@target-mysql:3306/shop
      TARGET_MARIADB_URL: pdo-mysql://root:root@target-mariadb:3306/shop
      TARGET_POSTGRES_URL: pdo-pgsql://postgres:root@target-postgres:5432/shop
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: php -S 0.0.0.0:8000 -t public

  # Base interne de TerrilDB (utilisateurs, connexions chiffrées, historique, audit)
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: terrildb
      POSTGRES_USER: terrildb
      POSTGRES_PASSWORD: terrildb
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrildb"]
      interval: 3s
      retries: 20

  # Bases cibles de test (profil "targets") : jeu de données ajouté dans un lot dédié
  target-mysql:
    profiles: [targets]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
    ports: ["33061:3306"]
    volumes:
      - ./docker/targets/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 3s
      retries: 40

  target-mariadb:
    profiles: [targets]
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: shop
    ports: ["33062:3306"]
    volumes:
      # même dialecte que MySQL pour ce jeu de données : scripts partagés
      - ./docker/targets/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  target-postgres:
    profiles: [targets]
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: shop
    ports: ["54321:5432"]
    volumes:
      - ./docker/targets/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 : le serveur d'initialisation n'écoute pas en TCP, donc "healthy" = init terminée
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]
      interval: 3s
      retries: 40

volumes:
  composer-cache:
  db-data:
