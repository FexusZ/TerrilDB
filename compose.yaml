services:
  php:
    build: docker/php
    # Nom fixe : la CI garde cette image d'un run à l'autre (docker save / load), et son nom ne doit pas dépendre du dossier du clone.
    image: terrildb-php
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - composer-cache:/tmp/composer
    environment:
      COMPOSER_HOME: /tmp/composer
    # DATABASE_URL (base interne, suffixe _test ajouté en environnement de test) et TARGET_*_URL (bases cibles de test,
    # groupe "integration") : générés par docker/init-env.sh, jamais versionnés.
    env_file: docker/dev/php.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: php -S 0.0.0.0:8000 -t public docker/php/router.php

  # Outillage front (Vue 3, Vite, Vitest) : l'hôte n'a pas Node.
  #   docker compose run --rm node npm install | test | run build | run lint | run typecheck
  #   docker compose --profile front up node   # serveur de développement sur :5173 (proxy vers le PHP)
  node:
    profiles: [front]
    image: node:26-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm
    ports:
      - "127.0.0.1:5173:5173"
    command: npm run dev -- --host 0.0.0.0

  # Base interne de TerrilDB (utilisateurs, connexions chiffrées, historique, audit)
  db:
    image: postgres:18-alpine
    env_file: docker/dev/internal-db.env
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrildb"]
      interval: 3s
      retries: 20

  # Bases cibles de test (profil "targets"). MySQL et MariaDB ont chacun DEUX cibles : la série à support long, que
  # des installations de production gardent des années, et la plus récente. Une version ne remplace pas l'autre ;
  # tests/Integration/Driver/TargetVersionTest.php garde chaque série à sa place (Dependabot ne monte pas les majeures
  # de ces images, voir .github/dependabot.yml : on change de série à la main, en connaissance de cause).
  target-mysql:
    profiles: [targets]
    image: mysql:8.4
    env_file: docker/dev/target-mysql.env
    ports: ["127.0.0.1:33061:3306"]
    volumes:
      - ./docker/targets/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      retries: 40

  target-mysql-26:
    profiles: [targets]
    image: mysql:26.10
    env_file: docker/dev/target-mysql.env
    ports: ["127.0.0.1:33063:3306"]
    volumes:
      - ./docker/targets/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      retries: 40

  target-mariadb:
    profiles: [targets]
    image: mariadb:11.8
    env_file: docker/dev/target-mariadb.env
    ports: ["127.0.0.1:33062:3306"]
    volumes:
      # même dialecte que MySQL pour ce jeu de données : scripts partagés
      - ./docker/targets/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  target-mariadb-13:
    profiles: [targets]
    image: mariadb:13.0
    env_file: docker/dev/target-mariadb.env
    ports: ["127.0.0.1:33064:3306"]
    volumes:
      - ./docker/targets/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  target-postgres:
    profiles: [targets]
    image: postgres:18-alpine
    env_file: docker/dev/target-postgres.env
    ports: ["127.0.0.1:54321:5432"]
    volumes:
      - ./docker/targets/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 : le serveur d'initialisation n'écoute pas en TCP, donc "healthy" = init terminée
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]
      interval: 3s
      retries: 40

  target-clickhouse:
    profiles: [targets]
    image: clickhouse/clickhouse-server:26.10
    env_file: docker/dev/target-clickhouse.env
    ports: ["127.0.0.1:18123:8123"]
    volumes:
      - ./docker/targets/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # --host sur l'adresse du conteneur : le serveur d'initialisation n'écoute que sur 127.0.0.1, donc "healthy" = init terminée
      test: ["CMD-SHELL", "clickhouse-client --host $$(hostname -i) --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT count() FROM shop.v_product_sales' | grep -q 400"]
      interval: 3s
      retries: 60

  target-redis:
    profiles: [targets]
    image: redis:8-alpine
    env_file: docker/dev/target-redis.env
    ports: ["127.0.0.1:63791:6379"]
    # Mot de passe lu dans l'environnement (jamais dans ce fichier) ; pas de persistance : cible jetable.
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 3s
      retries: 20

  # Paires source / réplica jetables (profil "replication", à part de "targets") : ce que lit
  # tests/Integration/Driver/ReplicationDiagnosticsTest quand TARGET_REPLICA_* / TARGET_REPLICATED_* sont définies. Aucune ne touche aux
  # cibles partagées. Voir docs/replication-tests.md.
  repl-pg-primary:
    profiles: [replication]
    image: postgres:18-alpine
    env_file: docker/dev/replication-postgres.env
    ports: ["127.0.0.1:54341:5432"]
    volumes:
      - ./docker/replication/postgres-primary:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      retries: 40

  repl-pg-replica:
    profiles: [replication]
    image: postgres:18-alpine
    user: postgres
    env_file: docker/dev/replication-postgres.env
    ports: ["127.0.0.1:54342:5432"]
    volumes:
      - ./docker/replication/postgres-replica/replica.sh:/replica.sh:ro
    entrypoint: ["sh", "/replica.sh"]
    depends_on:
      repl-pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U postgres -Atc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 3s
      retries: 60

  repl-redis-primary:
    profiles: [replication]
    image: redis:8-alpine
    env_file: docker/dev/replication-redis.env
    ports: ["127.0.0.1:63792:6379"]
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 3s
      retries: 20

  repl-redis-replica:
    profiles: [replication]
    image: redis:8-alpine
    env_file: docker/dev/replication-redis.env
    ports: ["127.0.0.1:63793:6379"]
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --replicaof repl-redis-primary 6379"]
    depends_on:
      repl-redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli info replication | grep -q master_link_status:up"]
      interval: 3s
      retries: 40

  repl-clickhouse:
    profiles: [replication]
    image: clickhouse/clickhouse-server:26.10
    env_file: docker/dev/replication-clickhouse.env
    ports: ["127.0.0.1:18124:8123"]
    volumes:
      - ./docker/replication/clickhouse/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./docker/replication/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host $$(hostname -i) --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT count() FROM d.rt' | grep -q 2"]
      interval: 3s
      retries: 60

  repl-mysql-source:
    profiles: [replication]
    image: mysql:8.4
    env_file: docker/dev/replication-mysql.env
    command: ["--server-id=1", "--log-bin=binlog", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    ports: ["127.0.0.1:33071:3306"]
    volumes:
      - ./docker/replication/mysql-source:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      retries: 40

  repl-mysql-replica:
    profiles: [replication]
    image: mysql:8.4
    env_file: docker/dev/replication-mysql.env
    # Sans journal binaire : le réplica n'écrit rien de local, aucune transaction errante.
    command: ["--server-id=2", "--skip-log-bin", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--read-only=ON"]
    ports: ["127.0.0.1:33072:3306"]
    volumes:
      - ./docker/replication/mysql-replica:/docker-entrypoint-initdb.d:ro
    depends_on:
      repl-mysql-source:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SHOW REPLICA STATUS\\G' 2>/dev/null | grep -q 'Replica_SQL_Running: Yes'"]
      interval: 3s
      retries: 60

  # MySQL seul, greffon semi-synchrone chargé, journal binaire et GTID allumés (TARGET_SEMISYNC_MYSQL_URL).
  repl-mysql-semisync:
    profiles: [replication]
    image: mysql:8.4
    env_file: docker/dev/replication-mysql.env
    command: ["--server-id=3", "--log-bin=binlog", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--plugin-load-add=semisync_source.so"]
    ports: ["127.0.0.1:33073:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      retries: 40

  repl-mariadb-source:
    profiles: [replication]
    image: mariadb:11.8
    env_file: docker/dev/replication-mariadb.env
    command: ["--server-id=1", "--log-bin=binlog", "--binlog-format=ROW"]
    ports: ["127.0.0.1:33074:3306"]
    volumes:
      - ./docker/replication/mariadb-source:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  repl-mariadb-replica:
    profiles: [replication]
    image: mariadb:11.8
    env_file: docker/dev/replication-mariadb.env
    command: ["--server-id=2", "--read-only=1"]
    ports: ["127.0.0.1:33075:3306"]
    volumes:
      - ./docker/replication/mariadb-replica:/docker-entrypoint-initdb.d:ro
    depends_on:
      repl-mariadb-source:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD -e 'SHOW REPLICA STATUS\\G' 2>/dev/null | grep -q 'Slave_SQL_Running: Yes'"]
      interval: 3s
      retries: 60

  # MariaDB seul, journal binaire sans expiration (TARGET_BINLOG_MARIADB_URL) : MariaDB 11.8 expire par défaut après 10 jours, d'où le 0 explicite.
  repl-mariadb-binlog:
    profiles: [replication]
    image: mariadb:11.8
    env_file: docker/dev/replication-mariadb.env
    command: ["--server-id=4", "--log-bin=binlog", "--binlog-format=ROW", "--binlog-expire-logs-seconds=0"]
    ports: ["127.0.0.1:33076:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

volumes:
  composer-cache:
  db-data:
