services:
  php:
    build: docker/php
    # Nom fixe : la CI garde cette image d'un run à l'autre (docker save / load), et son nom ne doit pas dépendre du dossier du clone.
    image: terrildb-php
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - composer-cache:/tmp/composer
      # Sockets des tunnels SSH (conteneur `tunnel`) et matériel du bastion de test (lecture seule) : voir docs/ssh-tunnel.md
      - tunnel-sockets:/run/tunnels
      - bastion-keys:/run/bastion-keys:ro
    environment:
      COMPOSER_HOME: /tmp/composer
    # DATABASE_URL (base interne, suffixe _test ajouté en environnement de test) et TARGET_*_URL (bases cibles de test,
    # groupe "integration") : générés par docker/init-env.sh, jamais versionnés.
    env_file: docker/dev/php.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: php -S 0.0.0.0:8000 -t public docker/php/router.php

  # Outillage front (Vue 3, Vite, Vitest) : l'hôte n'a pas Node.
  #   docker compose run --rm node npm install | test | run build | run lint | run typecheck
  #   docker compose --profile front up node   # serveur de développement sur :5173 (proxy vers le PHP)
  node:
    profiles: [front]
    image: node:26-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

  # Base interne de TerrilDB (utilisateurs, connexions chiffrées, historique, audit)
  db:
    image: postgres:18-alpine
    env_file: docker/dev/internal-db.env
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrildb"]
      interval: 3s
      retries: 20

  # Bases cibles de test (profil "targets") : jeu de données ajouté dans un lot dédié
  target-mysql:
    profiles: [targets]
    image: mysql:8.4
    env_file: docker/dev/target-mysql.env
    ports: ["33061:3306"]
    volumes:
      - ./docker/targets/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      retries: 40

  target-mariadb:
    profiles: [targets]
    image: mariadb:13.0
    env_file: docker/dev/target-mariadb.env
    ports: ["33062:3306"]
    volumes:
      # même dialecte que MySQL pour ce jeu de données : scripts partagés
      - ./docker/targets/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  target-postgres:
    profiles: [targets]
    image: postgres:18-alpine
    env_file: docker/dev/target-postgres.env
    ports: ["54321:5432"]
    volumes:
      - ./docker/targets/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 : le serveur d'initialisation n'écoute pas en TCP, donc "healthy" = init terminée
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]
      interval: 3s
      retries: 40

  target-clickhouse:
    profiles: [targets]
    image: clickhouse/clickhouse-server:26.10
    env_file: docker/dev/target-clickhouse.env
    ports: ["18123:8123"]
    volumes:
      - ./docker/targets/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # --host sur l'adresse du conteneur : le serveur d'initialisation n'écoute que sur 127.0.0.1, donc "healthy" = init terminée
      test: ["CMD-SHELL", "clickhouse-client --host $$(hostname -i) --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT count() FROM shop.v_product_sales' | grep -q 400"]
      interval: 3s
      retries: 60

  target-redis:
    profiles: [targets]
    image: redis:8-alpine
    env_file: docker/dev/target-redis.env
    ports: ["63791:6379"]
    # Mot de passe lu dans l'environnement (jamais dans ce fichier) ; pas de persistance : cible jetable.
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 3s
      retries: 20

  # Tunnel SSH (#13) : seul conteneur qui embarque `ssh` et qui sort vers les bastions. Pas de port publié ; système de
  # fichiers en lecture seule, aucune capacité, pas d'élévation ; les clés privées n'existent que dans un tmpfs.
  # Il tourne sous le MÊME uid que `php` : le dossier des sockets est en 0700.
  tunnel-init:
    profiles: [targets]
    image: alpine:3
    user: root
    command: ["sh", "-c", "chown ${UID:-1000}:${GID:-1000} /run/tunnels && chmod 700 /run/tunnels"]
    volumes:
      - tunnel-sockets:/run/tunnels

  tunnel:
    profiles: [targets]
    build: docker/tunnel
    image: terrildb-tunnel
    user: "${UID:-1000}:${GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Un tunnel = un processus ssh : bornes de ressources (et plafonds du relais : TUNNEL_MAX_TUNNELS, TUNNEL_MAX_PER_BASTION,
    # TUNNEL_MAX_CONNECTIONS, TUNNEL_OPEN_TIMEOUT).
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /run/relay-keys:mode=0700,uid=${UID:-1000},gid=${GID:-1000}
      - /tmp
    volumes:
      - tunnel-sockets:/run/tunnels
    environment:
      # Liste d'autorisation (vide = tout refusé) : ici le seul bastion de test.
      TERRILDB_SSH_ALLOWED_BASTIONS: target-bastion:22
    networks: [bastion-net]
    depends_on:
      tunnel-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/tunnels/control.sock"]
      interval: 2s
      retries: 20

  # Bastion de test : joint seul la base `target-behind-bastion`, qui n'est sur aucun réseau joignable par `php`.
  target-bastion:
    profiles: [targets]
    build: docker/targets/bastion
    image: terrildb-test-bastion
    volumes:
      - bastion-keys:/keys
    networks: [bastion-net, bastion-inner]
    healthcheck:
      test: ["CMD-SHELL", "test -f /keys/host_fingerprint && nc -z 127.0.0.1 22"]
      interval: 2s
      retries: 20

  target-behind-bastion:
    profiles: [targets]
    image: postgres:18-alpine
    env_file: docker/dev/target-postgres.env
    networks: [bastion-inner]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]
      interval: 3s
      retries: 40

networks:
  bastion-net: {}
  # Sans route vers l'extérieur ni vers `php` : seule la base cachée y vit, avec le bastion.
  bastion-inner:
    internal: true

volumes:
  tunnel-sockets:
  bastion-keys:
  composer-cache:
  db-data:
