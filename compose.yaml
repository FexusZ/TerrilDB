services:
  php:
    build: docker/php
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - composer-cache:/tmp/composer
    environment:
      COMPOSER_HOME: /tmp/composer
    # DATABASE_URL (base interne, suffixe _test ajouté en environnement de test) et TARGET_*_URL (bases cibles de test,
    # groupe "integration") : générés par docker/init-env.sh, jamais versionnés.
    env_file: docker/dev/php.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: php -S 0.0.0.0:8000 -t public docker/php/router.php

  # Outillage front (Vue 3, Vite, Vitest) : l'hôte n'a pas Node.
  #   docker compose run --rm node npm install | test | run build | run lint | run typecheck
  #   docker compose --profile front up node   # serveur de développement sur :5173 (proxy vers le PHP)
  node:
    profiles: [front]
    image: node:24-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

  # Base interne de TerrilDB (utilisateurs, connexions chiffrées, historique, audit)
  db:
    image: postgres:18-alpine
    env_file: docker/dev/internal-db.env
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrildb"]
      interval: 3s
      retries: 20

  # Bases cibles de test (profil "targets") : jeu de données ajouté dans un lot dédié
  target-mysql:
    profiles: [targets]
    image: mysql:8.4
    env_file: docker/dev/target-mysql.env
    ports: ["33061:3306"]
    volumes:
      - ./docker/targets/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      retries: 40

  target-mariadb:
    profiles: [targets]
    image: mariadb:11.8
    env_file: docker/dev/target-mariadb.env
    ports: ["33062:3306"]
    volumes:
      # même dialecte que MySQL pour ce jeu de données : scripts partagés
      - ./docker/targets/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  target-postgres:
    profiles: [targets]
    image: postgres:18-alpine
    env_file: docker/dev/target-postgres.env
    ports: ["54321:5432"]
    volumes:
      - ./docker/targets/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 : le serveur d'initialisation n'écoute pas en TCP, donc "healthy" = init terminée
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]
      interval: 3s
      retries: 40

volumes:
  composer-cache:
  db-data:
